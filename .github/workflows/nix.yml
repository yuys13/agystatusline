name: Nix CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - name: Format Check
        run: nix fmt -- --ci
      - name: Flake Check
        run: nix flake check --no-build --all-systems --keep-going
  build:
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - name: Lint
        run: nix develop --command golangci-lint run ./...
      - name: Run tests
        run: nix develop --command go test -v -race -shuffle=on ./...
      - name: Nix Build
        run: nix build
