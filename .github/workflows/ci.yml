name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@f137109411658d01edd92c6b2da637db55938024 # v5.5.0
        with:
          go-version-file: 'go.mod'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@2226d7cb06d077fb73e56ece7091fc5cf6856886 # v6.5.0
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@f137109411658d01edd92c6b2da637db55938024 # v5.5.0
        with:
          go-version-file: 'go.mod'
      - name: Run unit tests
        run: go test -v ./...
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@f137109411658d01edd92c6b2da637db55938024 # v5.5.0
        with:
          go-version-file: 'go.mod'
      - name: Build executable binary
        run: go build -v -o /dev/null ./...
